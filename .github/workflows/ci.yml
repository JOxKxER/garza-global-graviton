name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  daemon-self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The daemon is pure stdlib Python — no pip install step.
      - name: Compile-check sources
        run: python -m py_compile ggg_daemon.py zip_release.py

      - name: Run daemon built-in self-test
        env:
          GGG_VAULT_DIR: /tmp/ggg-selftest
        run: |
          python ggg_daemon.py | tee selftest.log
          grep -q "SELF-TEST OK" selftest.log
