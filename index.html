<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Editor App</title>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'geo')">Spatial / GPS</button>
        <button class="tab-btn" onclick="switchTab(event, 'motion')">Motion & Inertial</button>
        <button class="tab-btn" onclick="switchTab(event, 'status')">Device & Node</button>
        <button class="tab-btn" onclick="switchTab(event, 'log')">Field Event</button>
    </div>

    <!-- TAB 1: GEO -->
    <div id="geo" class="panel active">
        <h2>Precision Geolocation</h2>
        <pre id="geo-data">Acquiring satellite lock...</pre>
        <button class="action" onclick="requestGeoPermission()">Enable GPS Feed</button>
    </div>

    <!-- TAB 2: MOTION -->
    <div id="motion" class="panel">
        <h2>Motion & Orientation</h2>
        <pre id="motion-data">Awaiting sensor handshake...</pre>
        <button class="action" onclick="requestMotionPermission()">Enable Sensors</button>
    </div>

    <!-- TAB 3: STATUS -->
    <div id="status" class="panel">
        <h2>Node & Network Health</h2>
        <pre id="status-data">Checking environment...</pre>
    </div>

    <!-- TAB 4: MANUAL LOG -->
    <div id="log" class="panel">
        <h2>Field Event Logger</h2>
        <textarea id="log-notes" rows="4" style="width:100%; background:#090d16; color:#fff; border:none; padding:0.5rem; border-radius:0.5rem;" placeholder="Enter tactical or logistics notes..."></textarea>
        <button class="action" onclick="submitLog()">Transmit Packet</button>
    </div>

<script>
    let telemetryBuffer = [];

    function switchTab(evt, tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    // 1. Geolocation Stream
    function requestGeoPermission() {
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(pos => {
                const data = {
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude,
                    alt: pos.coords.altitude,
                    speed: pos.coords.speed,
                    heading: pos.coords.heading,
                    timestamp: pos.timestamp
                };
                document.getElementById('geo-data').innerText = JSON.stringify(data, null, 2);
                telemetryBuffer.push({ type: 'geo', payload: data });
            }, err => alert(err.message), { enableHighAccuracy: true });
        }
    }

    // 2. Motion & Orientation
    function requestMotionPermission() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(response => {
                if (response === 'granted') startMotionListeners();
            });
        } else {
            startMotionListeners();
        }
    }

    function startMotionListeners() {
        window.addEventListener('devicemotion', (e) => {
            const data = {
                accel: { x: e.acceleration.x, y: e.acceleration.y, z: e.acceleration.z },
                rotation: { alpha: e.rotationRate.alpha, beta: e.rotationRate.beta, gamma: e.rotationRate.gamma }
            };
            document.getElementById('motion-data').innerText = JSON.stringify(data, null, 2);
        });
    }

    // 3. Status Polling
    setInterval(async () => {
        let batteryInfo = {};
        if ('getBattery' in navigator) {
            const b = await navigator.getBattery();
            batteryInfo = { level: b.level, charging: b.charging };
        }
        const netInfo = navigator.connection ? { type: navigator.connection.effectiveType, downlink: navigator.connection.downlink } : {};
        
        document.getElementById('status-data').innerText = JSON.stringify({
            battery: batteryInfo,
            network: netInfo,
            online: navigator.onLine,
            queuedPackets: telemetryBuffer.length
        }, null, 2);
    }, 2000);

    function submitLog() {
        const notes = document.getElementById('log-notes').value;
        alert("Packet queued locally: " + notes);
        document.getElementById('log-notes').value = '';
    }
</script>
</body>
</html>
</html>
