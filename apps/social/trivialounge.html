<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TriviaLounge - Multiplayer Buzzer Game</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: monospace; padding: 25px; display: flex; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; max-width: 480px; width: 100%; padding: 25px; border-radius: 12px; text-align: center; }
    h1 { color: #38bdf8; font-size: 1.3rem; margin-top: 0; }
    .buzz-btn { background: #ef4444; color: #fff; font-size: 1.5rem; font-weight: bold; border: none; padding: 30px; border-radius: 50%; width: 140px; height: 140px; margin: 20px auto; cursor: pointer; box-shadow: 0 0 20px rgba(239,68,68,0.5); }
  </style>
</head>
<body>
<div class="card">
  <h1>TRIVIALOUNGE™ // BUZZER</h1>
  <div style="font-size: 0.8rem; color: #64748b;">SYNCED MULTIPLAYER BUZZPAD</div>
  <button class="buzz-btn" onclick="alert('BUZZED IN FIRST!')">BUZZ!</button>
</div>
</body>
</html>
