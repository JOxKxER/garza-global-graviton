<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PledgeThermometer - Live Fundraising Goal</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: monospace; padding: 25px; display: flex; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; max-width: 480px; width: 100%; padding: 25px; border-radius: 12px; text-align: center; }
    h1 { color: #38bdf8; font-size: 1.3rem; margin-top: 0; }
    .bar { background: #1e293b; border-radius: 8px; height: 30px; width: 100%; margin: 20px 0; overflow: hidden; position: relative; }
    .fill { background: #34d399; height: 100%; width: 75%; }
  </style>
</head>
<body>
<div class="card">
  <h1>PLEDGETHERMOMETER™</h1>
  <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">REAL-TIME GOAL PROGRESS DISPLAY</div>
  <div style="font-size: 1.5rem; font-weight: bold; color: #34d399;">$7,500 / $10,000 Raised</div>
  <div class="bar"><div class="fill"></div></div>
</div>
</body>
</html>
