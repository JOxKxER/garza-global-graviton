<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graviton Sports - Poisson Match Predictor</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: #38bdf8; margin: 0; font-size: 1.2rem; }
    .panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; background: #060911; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: #38bdf8; color: #060911; font-weight: bold; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 0.9rem; }
    button:hover { background: #0ea5e9; }
    .results { background: #090d16; padding: 15px; border-radius: 6px; border: 1px solid #1f2937; font-family: monospace; font-size: 0.9rem; color: #34d399; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>POISSON MATCH GOAL PREDICTOR</h1>
    <a href="../../index.html" style="color: #38bdf8; text-decoration: none; font-size: 0.85rem;">← Back</a>
  </header>

  <div class="panel">
    <label>Team A Expected Goals (xG)</label>
    <input type="number" id="teamA_xG" value="1.65" step="0.05">

    <label>Team B Expected Goals (xG)</label>
    <input type="number" id="teamB_xG" value="1.15" step="0.05">

    <button onclick="calculatePoisson()">Compute Probabilities →</button>
  </div>

  <div class="panel">
    <h3>Statistical Outcomes</h3>
    <div class="results" id="output">
      Enter expected goal averages to compute win/draw probabilities and total score distributions.
    </div>
  </div>
</div>

<script>
  function factorial(n) {
    if (n === 0 || n === 1) return 1;
    let res = 1;
    for (let i = 2; i <= n; i++) res *= i;
    return res;
  }

  function poissonProb(lambda, k) {
    return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
  }

  function calculatePoisson() {
    let lA = parseFloat(document.getElementById('teamA_xG').value);
    let lB = parseFloat(document.getElementById('teamB_xG').value);

    let probA_win = 0, probDraw = 0, probB_win = 0;
    let exactScores = [];

    for (let a = 0; a <= 6; a++) {
      for (let b = 0; b <= 6; b++) {
        let p = poissonProb(lA, a) * poissonProb(lB, b);
        if (a > b) probA_win += p;
        else if (a === b) probDraw += p;
        else probB_win += p;
        
        exactScores.push({a, b, p});
      }
    }

    exactScores.sort((x, y) => y.p - x.p);
    let mostLikely = exactScores[0];

    document.getElementById('output').innerHTML = `
      > Team A Win Probability: <b>${(probA_win * 100).toFixed(1)}%</b><br>
      > Draw Probability: <b>${(probDraw * 100).toFixed(1)}%</b><br>
      > Team B Win Probability: <b>${(probB_win * 100).toFixed(1)}%</b><br>
      > Most Likely Exact Score: <b style="color: #38bdf8;">Team A ${mostLikely.a} - ${mostLikely.b} Team B</b> (${(mostLikely.p * 100).toFixed(1)}%)
    `;
  }
</script>

</body>
</html>
