<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SnackShack - Concession POS</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: monospace; padding: 25px; display: flex; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; max-width: 480px; width: 100%; padding: 25px; border-radius: 12px; text-align: center; }
    h1 { color: #38bdf8; font-size: 1.3rem; margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
<div class="card">
  <h1>SNACKSHACK™ POS</h1>
  <div style="font-size: 0.8rem; color: #64748b;">OFFLINE SCHOOL CONCESSION REGISTER</div>
  <div class="grid">
    <button onclick="alert('Added Hot Dog ($3.00)')">🌭 Hot Dog ($3)</button>
    <button onclick="alert('Added Water ($1.00)')">💧 Water ($1)</button>
  </div>
</div>
</body>
</html>
