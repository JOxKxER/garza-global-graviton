<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreBoard Pro - Youth Game Clock</title>
  <style>
    body { background: #020617; color: #f8fafc; font-family: monospace; padding: 25px; text-align: center; }
    .board { background: #0f172a; border: 2px solid #38bdf8; max-width: 500px; margin: auto; padding: 25px; border-radius: 12px; }
    .score { font-size: 3rem; font-weight: bold; color: #34d399; }
  </style>
</head>
<body>
<div class="board">
  <h1>SCOREBOARD PRO™</h1>
  <div style="font-size:0.8rem; color:#64748b; margin-bottom:15px;">YOUTH FOOTBALL / SOCCER CLOCK</div>
  <div style="display:flex; justify-content:space-around;">
    <div>HOME <div class="score">24</div></div>
    <div>AWAY <div class="score">14</div></div>
  </div>
</div>
</body>
</html>
