<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecretSanta Local - Offline Matcher</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: monospace; padding: 25px; display: flex; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; max-width: 480px; width: 100%; padding: 25px; border-radius: 12px; }
    h1 { color: #ef4444; font-size: 1.3rem; margin-top: 0; }
    textarea { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; height: 100px; font-family: monospace; }
    button { width: 100%; background: #22c55e; color: #020617; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    .result-list { margin-top: 20px; }
    .match-item { background: #020617; border: 1px solid #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .reveal-btn { width: auto; margin-top: 0; padding: 6px 12px; background: #334155; color: #fff; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="card">
  <h1>SECRETSANTA LOCAL™</h1>
  <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 12px;">100% AIR-GAPPED ON-DEVICE MATCHER</div>

  <label style="font-size: 0.85rem; color: #94a3b8;">Enter Participants (One Per Line):</label>
  <textarea id="names-input">Joel
Sarah
Mark
Elena
David</textarea>

  <button id="draw-btn">🎁 Generate Secret Matches</button>

  <div class="result-list" id="results"></div>
</div>

<script>
  document.getElementById('draw-btn').addEventListener('click', () => {
    const raw = document.getElementById('names-input').value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
    if (raw.length < 3) {
      alert("Please enter at least 3 participants.");
      return;
    }

    // Derangement algorithm (no one gets themselves)
    let givers = [...raw];
    let receivers = [...raw];
    let isValid = false;

    while (!isValid) {
      // Fisher-Yates shuffle
      for (let i = receivers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [receivers[i], receivers[j]] = [receivers[j], receivers[i]];
      }
      isValid = givers.every((giver, idx) => giver !== receivers[idx]);
    }

    const container = document.getElementById('results');
    container.innerHTML = `<p style="font-size: 0.8rem; color: #94a3b8; text-align: center;">Tap 'Reveal' privately to see your match:</p>`;

    givers.forEach((giver, idx) => {
      const row = document.createElement('div');
      row.className = 'match-item';
      row.innerHTML = `
        <strong>${giver}</strong>
        <span id="target-${idx}" style="color: #64748b; font-size: 0.9rem;">[Hidden]</span>
        <button class="reveal-btn" onclick="reveal(${idx}, '${receivers[idx]}')">Reveal</button>
      `;
      container.appendChild(row);
    });
  });

  function reveal(idx, targetName) {
    const el = document.getElementById(`target-${idx}`);
    el.innerText = `➔ Gives to: ${targetName}`;
    el.style.color = "#34d399";
    setTimeout(() => {
      el.innerText = "[Hidden]";
      el.style.color = "#64748b";
    }, 5000);
  }
</script>
</body>
</html>
