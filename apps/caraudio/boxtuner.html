<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoxTuner - Subwoofer Enclosure & Port Solver</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: monospace; padding: 25px; display: flex; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; max-width: 500px; width: 100%; padding: 25px; border-radius: 12px; }
    h1 { color: #38bdf8; font-size: 1.3rem; margin-top: 0; }
    .badge { background: #064e3b; color: #34d399; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; float: right; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin: 10px 0 4px; }
    input, select { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    button { width: 100%; background: #38bdf8; color: #020617; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1rem; }
    button:hover { background: #0284c7; }
    .readout { background: #020617; border: 1px solid #334155; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; }
    .readout strong { color: #34d399; font-size: 1.2rem; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge" id="daily-badge">Daily: 0/15</span>
  <h1>BOXTUNER™ // ENCLOSURE HUD</h1>
  <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 10px;">SUBWOOFER BOX & SLOT PORT TUNER</div>

  <label>External Dimensions (Inches: H x W x D)</label>
  <div class="grid-3">
    <input type="number" id="box-h" value="16" placeholder="H">
    <input type="number" id="box-w" value="32" placeholder="W">
    <input type="number" id="box-d" value="18" placeholder="D">
  </div>

  <label>Wood Thickness & Subwoofer Displacement</label>
  <div class="grid-3">
    <select id="wood-thick" style="grid-column: span 2;">
      <option value="0.75">3/4" (0.75") MDF / Birch</option>
      <option value="1.0">1.0" Heavy Baffle</option>
    </select>
    <input type="number" id="sub-disp" value="0.14" step="0.01" placeholder="Disp ft³">
  </div>

  <label>Target Tuning Frequency ($F_b$ Hz)</label>
  <input type="number" id="target-hz" value="32" step="1">

  <button id="calc-btn">Compute Net Volume & Slot Port</button>

  <div class="readout" id="results">
    <div>Net Internal Volume: <strong id="net-vol">4.21 ft³</strong></div>
    <div style="margin-top: 6px;">Slot Port Length (3" x 14.5"): <strong id="port-len">24.2" Long</strong></div>
  </div>
</div>

<script>
  const MAX_FREE = 15;
  function getUsage() {
    const today = new Date().toISOString().split('T')[0];
    const data = JSON.parse(localStorage.getItem('boxtuner_usage') || '{}');
    return (data.date === today) ? data : { date: today, count: 0 };
  }
  function updateDisplay() {
    const usage = getUsage();
    document.getElementById('daily-badge').innerText = `Daily: ${usage.count}/${MAX_FREE}`;
    if (usage.count >= MAX_FREE) document.getElementById('calc-btn').disabled = true;
  }
  function incrementUsage() {
    const usage = getUsage();
    usage.count++;
    localStorage.setItem('boxtuner_usage', JSON.stringify(usage));
    updateDisplay();
  }

  document.getElementById('calc-btn').addEventListener('click', () => {
    const usage = getUsage();
    if (usage.count >= MAX_FREE) return;

    const h = parseFloat(document.getElementById('box-h').value);
    const w = parseFloat(document.getElementById('box-w').value);
    const d = parseFloat(document.getElementById('box-d').value);
    const t = parseFloat(document.getElementById('wood-thick').value);
    const disp = parseFloat(document.getElementById('sub-disp').value);
    const fb = parseFloat(document.getElementById('target-hz').value);

    // Internal dimensions
    const inH = h - (2 * t);
    const inW = w - (2 * t);
    const inD = d - (2 * t);
    const grossCuFt = (inH * inW * inD) / 1728;
    const netCuFt = (grossCuFt - disp - 0.35).toFixed(2); // estimated port disp

    // Slot port length formula: Lv = (23562.5 * Dv^2 / (Fb^2 * Vb)) - (0.732 * Dv)
    // Port Area approx 43.5 sq in (3 x 14.5) -> Equiv round dia = sqrt(4 * 43.5 / PI) = 7.44"
    const portLen = Math.max(10, Math.round((23562.5 * Math.pow(7.44, 2) / (Math.pow(fb, 2) * netCuFt * 1728)) * 12));

    document.getElementById('net-vol').innerText = `${netCuFt} ft³`;
    document.getElementById('port-len').innerText = `${portLen}" Long`;
    incrementUsage();
  });

  updateDisplay();
</script>
</body>
</html>
