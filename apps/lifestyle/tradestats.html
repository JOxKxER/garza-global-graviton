<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TradeStats - Options & Technical Analysis HUD</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: monospace; padding: 25px; display: flex; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; max-width: 480px; width: 100%; padding: 25px; border-radius: 12px; }
    h1 { color: #38bdf8; font-size: 1.3rem; margin-top: 0; }
    .badge { background: #064e3b; color: #34d399; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; float: right; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin: 12px 0 4px; }
    select, input { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; background: #38bdf8; color: #020617; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1rem; }
    .readout { background: #020617; border: 1px solid #334155; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; font-size: 0.95rem; color: #34d399; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge" id="daily-badge">Daily: 0/15</span>
  <h1>TRADESTATS™ // OPTIONS HUD</h1>
  <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">TECHNICAL PATTERN & SYNTHETIC STRATEGY</div>

  <label>Target Ticker / Asset</label>
  <select id="ticker">
    <option value="DRV">DRV (Real Estate Bear 3X ETF)</option>
    <option value="XLRE">XLRE (Real Estate Select Sector Index)</option>
    <option value="SPY">SPY (S&P 500 ETF Trust)</option>
  </select>

  <label>Strike Price</label>
  <input type="number" id="strike" value="45.00" step="0.50">

  <button id="calc-btn">Compute Synthetic Option Delta & Break-Even</button>

  <div class="readout" id="results">
    Strategy: Synthetic Long Call Position<br>
    Delta Exposure: <strong>0.92</strong> | Breakeven: <strong>$47.10</strong>
  </div>
</div>

<script>
  const MAX_FREE = 15;
  function getUsage() {
    const today = new Date().toISOString().split('T')[0];
    const data = JSON.parse(localStorage.getItem('tradestats_usage') || '{}');
    return (data.date === today) ? data : { date: today, count: 0 };
  }
  function updateDisplay() {
    const usage = getUsage();
    document.getElementById('daily-badge').innerText = `Daily: ${usage.count}/${MAX_FREE}`;
    if (usage.count >= MAX_FREE) document.getElementById('calc-btn').disabled = true;
  }
  function incrementUsage() {
    const usage = getUsage();
    usage.count++;
    localStorage.setItem('tradestats_usage', JSON.stringify(usage));
    updateDisplay();
  }

  document.getElementById('calc-btn').addEventListener('click', () => {
    const usage = getUsage();
    if (usage.count >= MAX_FREE) return;

    const ticker = document.getElementById('ticker').value;
    const strike = parseFloat(document.getElementById('strike').value);
    const premium = (strike * 0.045).toFixed(2);
    const breakeven = (strike + parseFloat(premium)).toFixed(2);

    document.getElementById('results').innerHTML = `
      Asset: <strong>${ticker}</strong> | Synthetic Long Setup<br>
      Net Debit Premium: <strong>$${premium}</strong><br>
      Option Breakeven Price: <strong style="color:#facc15;">$${breakeven}</strong>
    `;
    incrementUsage();
  });

  updateDisplay();
</script>
</body>
</html>
