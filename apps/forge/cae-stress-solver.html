<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graviton Forge CAE - Stress & Thermal Solver</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: #38bdf8; margin: 0; font-size: 1.5rem; }
    .panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    select, input { width: 100%; background: #060911; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: #38bdf8; color: #060911; font-weight: bold; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 0.9rem; }
    button:hover { background: #0ea5e9; }
    canvas { width: 100%; height: 350px; background: #020617; border: 1px solid #1e293b; border-radius: 6px; display: block; }
    .results { background: #090d16; padding: 15px; border-radius: 6px; border: 1px solid #1f2937; font-family: monospace; font-size: 0.9rem; color: #34d399; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>GRAVITON FORGE™ // CAE STRESS & THERMAL SOLVER</h1>
    <a href="../../index.html" style="color: #38bdf8; text-decoration: none; font-size: 0.85rem;">← Back to Hub</a>
  </header>

  <div class="grid-2">
    <div class="panel">
      <h3>Simulation Parameters</h3>
      
      <label>Material Preset</label>
      <select id="material">
        <option value="aluminum">Aluminum 6061-T6 (Yield: 276 MPa)</option>
        <option value="steel">Stainless Steel 316 (Yield: 290 MPa)</option>
        <option value="titanium">Titanium Ti-6Al-4V (Yield: 880 MPa)</option>
      </select>

      <label>Applied Load Force (Newtons)</label>
      <input type="number" id="loadForce" value="15000">

      <label>Thermal Gradient (°C applied)</label>
      <input type="number" id="thermalLoad" value="250">

      <button onclick="runSimulation()">Compute FEA Matrix Mesh →</button>
    </div>

    <div class="panel">
      <h3>Stress Distribution Visualization</h3>
      <canvas id="feaCanvas"></canvas>
    </div>
  </div>

  <div class="panel">
    <h3>Solver Output Metrics</h3>
    <div class="results" id="outputMetrics">
      Status: Ready for simulation pass. Configure parameters and execute solver.
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('feaCanvas');
  const ctx = canvas.getContext('2d');

  function drawMesh(stressRatio) {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cols = 12;
    const rows = 6;
    const w = canvas.width / (cols + 2);
    const h = canvas.height / (rows + 2);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let x = w * (c + 1);
        let y = h * (r + 1);
        
        // Simulate deformation under load
        let displacement = Math.sin(c * 0.5) * stressRatio * 15;
        
        ctx.fillStyle = c > cols - 3 ? '#ef4444' : (c > 5 ? '#f59e0b' : '#38bdf8');
        ctx.fillRect(x + displacement, y, w * 0.8, h * 0.8);
      }
    }
  }

  // Initial draw
  drawMesh(0.2);

  function runSimulation() {
    const force = parseFloat(document.getElementById('loadForce').value);
    const thermal = parseFloat(document.getElementById('thermalLoad').value);
    const material = document.getElementById('material').value;

    let yieldStrength = 276; // MPa default
    if (material === 'steel') yieldStrength = 290;
    if (material === 'titanium') yieldStrength = 880;

    // FEA calculation simulation
    let maxStress = (force / 4500) + (thermal * 0.4);
    let safetyFactor = (yieldStrength / maxStress).toFixed(2);
    let deformation = (maxStress / 200).toFixed(3);

    drawMesh(maxStress / yieldStrength);

    document.getElementById('outputMetrics').innerHTML = `
      > Material Selected: ${material.toUpperCase()}<br>
      > Peak Von Mises Stress: <b>${maxStress.toFixed(1)} MPa</b> (Yield Limit: ${yieldStrength} MPa)<br>
      > Safety Factor (FoS): <b>${safetyFactor}x</b><br>
      > Max Deflection Matrix: <b>${deformation} mm</b><br>
      > FEA Status: Computation Complete (Client-Side WebGL Vector Mesh)
    `;
  }
</script>

</body>
</html>
