<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SerialDrip - Web Serial DNC Feeder</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: monospace; padding: 25px; display: flex; justify-content: center; }
    .card { background: #0f172a; border: 1px solid #1e293b; max-width: 480px; width: 100%; padding: 25px; border-radius: 12px; text-align: center; }
    h1 { color: #38bdf8; font-size: 1.3rem; margin-top: 0; }
    button { background: #38bdf8; color: #020617; border: none; padding: 12px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
<div class="card">
  <h1>SERIALDRIP™ // WEB DNC</h1>
  <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">RS-232 SERIAL G-CODE STREAMER</div>
  <div style="background:#020617; padding:15px; border-radius:6px; border:1px solid #334155; font-size:0.85rem; color:#34d399; margin-bottom:15px;">
    Port Status: <strong>Ready (Baud: 9600, 8-N-1)</strong>
  </div>
  <button onclick="alert('Web Serial API requested. Select USB-to-RS232 adapter.')">Connect Legacy CNC via USB Serial</button>
</div>
</body>
</html>
