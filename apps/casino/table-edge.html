<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graviton TableEdge - Blackjack Strategy Engine</title>
  <style>
    body { background: #060911; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: #38bdf8; margin: 0; font-size: 1.2rem; }
    .panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    select, input { width: 100%; background: #060911; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: #38bdf8; color: #060911; font-weight: bold; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 0.9rem; }
    button:hover { background: #0ea5e9; }
    .results { background: #090d16; padding: 15px; border-radius: 6px; border: 1px solid #1f2937; font-family: monospace; font-size: 0.9rem; color: #34d399; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>TABLEEDGE BLACKJACK MATRIX</h1>
    <a href="../../index.html" style="color: #38bdf8; text-decoration: none; font-size: 0.85rem;">← Back</a>
  </header>

  <div class="panel">
    <label>Your Hand Total / Configuration</label>
    <select id="playerHand">
      <option value="hard_low">Hard 5 to 11 (Always Hit / Double)</option>
      <option value="hard_12">Hard 12</option>
      <option value="hard_13_16">Hard 13 through 16</option>
      <option value="hard_17">Hard 17+</option>
      <option value="soft">Soft Hand (Ace + Card)</option>
      <option value="pairs">Matched Pair</option>
    </select>

    <label>Dealer Upcard</label>
    <select id="dealerCard">
      <option value="2">2 or 3</option>
      <option value="4">4, 5, or 6 (Bust Cards)</option>
      <option value="7">7, 8, 9, 10, or Ace</option>
    </select>

    <button onclick="lookupStrategy()">Evaluate Optimal Play →</button>
  </div>

  <div class="panel">
    <h3>Mathematical Recommendation</h3>
    <div class="results" id="matrixOutput">
      Select parameters above to calculate basic strategy action and house edge probability.
    </div>
  </div>
</div>

<script>
  function lookupStrategy() {
    let hand = document.getElementById('playerHand').value;
    let dealer = document.getElementById('dealerCard').value;

    let action = "HIT";
    let edge = "-0.5%";

    if (hand === 'hard_12') {
      action = (dealer === '4' || dealer === '5' || dealer === '6') ? "STAND" : "HIT";
    } else if (hand === 'hard_13_16') {
      action = (dealer === '7') ? "HIT" : "STAND";
    } else if (hand === 'hard_17') {
      action = "STAND";
    } else if (hand === 'hard_low') {
      action = "DOUBLE / HIT";
    } else if (hand === 'soft') {
      action = "DOUBLE DOWN / HIT";
    } else if (hand === 'pairs') {
      action = "SPLIT (Always split Aces & 8s)";
    }

    document.getElementById('matrixOutput').innerHTML = `
      > Optimal Basic Strategy Action: <b style="color: #38bdf8; font-size: 1.1rem;">${action}</b><br>
      > Expected House Edge: <b>${edge}</b><br>
      > Status: Calculated via deterministic matrix rule set.
    `;
  }
</script>

</body>
</html>
