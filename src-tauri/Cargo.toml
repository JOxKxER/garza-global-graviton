[package]
name = "ggg-gauntlet"
version = "1.4.5"
description = "Global Graviton Gauntlet (#GGG) — sovereign offline AI desktop shell"
authors = ["Garza Global Graviton LLC"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: native system tray with Show / Recheck Ollama / Quit hooks.
tauri = { version = "2", features = ["tray-icon"] }
# ureq with default features disabled: plain-HTTP loopback pings only, no TLS stack pulled in.
ureq = { version = "2.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
